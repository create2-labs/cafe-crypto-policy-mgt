name: Docker RC

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      target_version:
        description: "Target version for optional RC tag (e.g. 1.0.0 or v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build-and-push:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout default ref
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version and SHA
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          RC_TAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.target_version }}" ]]; then
            V="${{ inputs.target_version }}"
            V="${V#v}"
            RC_TAG="v${V}-rc${{ github.run_id }}"
          elif [[ "${{ github.event_name }}" == "pull_request_target" && -n "${{ github.event.label.name }}" ]]; then
            LABEL="${{ github.event.label.name }}"
            if [[ "$LABEL" =~ ^(rc|build)-v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              V="${BASH_REMATCH[2]}"
              RC_TAG="v${V}-rc${{ github.run_id }}"
            fi
          fi
          echo "rc_tag=$RC_TAG" >> $GITHUB_OUTPUT

          # APP_VERSION for build-arg (exposed in GET /version — CPM-OPS-3)
          if [[ -n "$RC_TAG" ]]; then
            APP_VERSION="$RC_TAG"
          else
            APP_VERSION="dev-$SHORT_SHA"
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          echo "short_sha=$SHORT_SHA"
          echo "rc_tag=${RC_TAG:-<none>}"
          echo "app_version=$APP_VERSION"

      - name: Document RC parity plan
        run: |
          echo "PR0 baseline: image repository/tag wiring and vulnerability scan policy will be finalized in follow-up PR."
          echo "This workflow intentionally captures trigger/guard/versioning logic parity with cafe-discovery."
          echo "APP_VERSION for docker build: ${{ steps.version.outputs.app_version }}"
