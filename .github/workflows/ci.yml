name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Shell scripts guard (Option A — no legacy Discovery wallet contexts route)
        run: |
          set -euo pipefail
          bash scripts/ci/assert-scripts-use-discovery-wallet-scans-v1-only.sh
          bash -n scripts/test-discovery-v1-wallet-scans-to-cpm.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CPM CI image
        run: |
          set -euo pipefail
          docker build \
            --target ci \
            -f Dockerfile-cpm \
            -t cafe-cpm:ci .

      - name: Run CPM CI checks (inside CI image)
        run: |
          docker run --rm cafe-cpm:ci
