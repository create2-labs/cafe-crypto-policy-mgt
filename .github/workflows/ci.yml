name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CPM CI image
        run: |
          set -euo pipefail
          docker build \
            --target ci \
            -f Dockerfile \
            -t cafe-cpm:ci .

      - name: Run CPM CI checks (inside CI image)
        run: |
          docker run --rm cafe-cpm:ci
